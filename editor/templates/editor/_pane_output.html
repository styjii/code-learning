{# Panneau de droite des éditeurs à aperçu : barre de commandes, aperçu en cadre de navigateur, console intégrée. #}
<section id="output-container" aria-label="Résultat" data-view="preview">
    <div id="control-button">
        <div class="seg" role="group" aria-label="Affichage">
            <button type="button" id="display-preview" class="is-active" aria-pressed="true">Aperçu</button>
            <button type="button" id="display-console" aria-pressed="false" aria-controls="console">Console</button>
        </div>
        <span class="toolbar-spacer"></span>
        {% if ts %}<span id="ts-summary" class="ts-summary" role="status" aria-live="polite" title="Options du compilateur (menu « Options TypeScript »)"></span>{% endif %}
        <div class="auto-toggle">
            <label for="live-code" id="live-label">Aperçu auto : non</label>
            <button type="button" id="live-code" class="toggle" role="switch" aria-checked="false" aria-labelledby="live-label"></button>
        </div>
        <div class="run-split">
            <button type="button" id="run-code" aria-label="Exécuter le code" title="Exécuter (Ctrl+Entrée)"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>Exécuter</button>
            <div class="drop">
                <button type="button" class="navlink run-more" aria-haspopup="true" aria-expanded="false" aria-label="Disposition et délai" title="Disposition et délai">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <ul class="drop-menu" role="menu">
                    <li class="drop-head" role="presentation"><small>Disposition</small></li>
                    <li><button type="button" class="drop-item" role="menuitemradio" data-layout="auto" aria-checked="true">Automatique</button></li>
                    <li><button type="button" class="drop-item" role="menuitemradio" data-layout="side" aria-checked="false">Côte à côte</button></li>
                    <li><button type="button" class="drop-item" role="menuitemradio" data-layout="stack" aria-checked="false">Empilé</button></li>
                    <li class="drop-sep" role="separator"></li>
                    <li><button type="button" class="drop-item" data-toggle="custom-modal" data-target="#preview-controls">Délai de l'aperçu…</button></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="preview-stage">
        <div class="browser">
            <div class="browser-bar">
                <button type="button" class="browser-btn" id="reload-preview" title="Recharger l'aperçu" aria-label="Recharger l'aperçu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
                <span class="browser-url" id="preview-url">localhost / index.html</span>
                <button type="button" class="browser-btn" id="open-preview" title="Ouvrir dans un nouvel onglet" aria-label="Ouvrir l'aperçu dans un nouvel onglet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
            </div>
            <iframe id="output" title="Aperçu" sandbox="allow-scripts allow-modals allow-forms"></iframe>
        </div>
        <div class="preview-meta"><span id="preview-size">0 • 0</span><span id="preview-updated">En attente d'exécution</span></div>
    </div>

    <section class="console-dock" aria-label="Console">
        <header class="console-head">
            <h3 class="console-title">Console</h3>
            <span class="count" id="console-count">0</span>
            <span class="console-ro">Sortie en lecture seule</span>
            <span class="toolbar-spacer"></span>
            <button type="button" class="icon-btn" id="console-clear" title="Effacer la console" aria-label="Effacer la console"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
            <button type="button" class="icon-btn" id="console-close" title="Réduire la console" aria-label="Réduire la console"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </header>
        <div id="console"></div>
    </section>
</section>
