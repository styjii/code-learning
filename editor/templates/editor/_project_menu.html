{# Menu « Projet » (engrenage) : chaque entrée ouvre une fenêtre existante ou déclenche une commande existante (voir Workbench.js). #}
<ul class="drop-menu project-menu" role="menu">
    <li class="drop-head" role="presentation"><small>Projet</small><strong data-project-name>…</strong></li>
    <li><button type="button" class="drop-item" data-toggle="custom-modal" data-target="#project-controls" data-action="new-project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nouveau projet<kbd>Alt+N</kbd></button></li>
    <li><button type="button" class="drop-item" data-toggle="custom-modal" data-target="#project-controls" data-action="open-project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Ouvrir un projet…</button></li>
    <li><button type="button" class="drop-item" data-toggle="custom-modal" data-target="#project-controls" data-action="rename-project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Renommer le projet</button></li>
    <li class="drop-sep" role="separator"></li>
    <li><button type="button" class="drop-item" data-toggle="custom-modal" data-target="#zip-controls" data-action="import-zip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>Importer un .zip</button></li>
    <li><button type="button" class="drop-item" data-action="export-zip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>Exporter en .zip<kbd>Ctrl+Maj+E</kbd></button></li>
    {% if has_preview %}
    <li class="drop-sep" role="separator"></li>
    <li><button type="button" class="drop-item" role="menuitemcheckbox" aria-checked="false" data-action="toggle-live" data-live-item><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Aperçu automatique<span class="pill" data-live-indicator>Non</span></button></li>
    <li><button type="button" class="drop-item" data-toggle="custom-modal" data-target="#head-controls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5"/></svg>Bibliothèques (CDN)<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></li>
    {% endif %}
    <li class="drop-sep" role="separator"></li>
    <li><button type="button" class="drop-item danger" data-toggle="custom-modal" data-target="#project-controls" data-action="delete-project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Supprimer le projet</button></li>
    <li class="drop-note" role="presentation">Les modifications sont enregistrées automatiquement.</li>
</ul>
