{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB PREVIEW</title>
    {% for css in cdn_css %}
    <link rel="stylesheet" href="{{ css }}">
    {% endfor %}
    
    <!-- Favicon -->
    <link rel="icon" href="{% static 'icons/editor.svg' %}" type="image/svg+xml">
    
    <!-- custom style -->
    <style>{{ css|safe }}</style>
</head>
<body>
    <!-- custom html -->
    {{ html|safe }}

    {% for js in cdn_js %}
    <script src="{{ js }}"></script>
    {% endfor %}

    <!-- script -->
    <script src="{% static 'editor/js/console/console-runtime.js' %}"></script>
    <script src="{% static 'editor/js/iframe-console.js' %}"></script>

    <!-- project -->
    <script>
        try {
            {{ js|safe }}
        } catch (e) {
            window.onerror(e.message, e.filename || "inline", e.lineno || 1, e.colno || 1, e);
        }
    </script>
</body>
</html>
