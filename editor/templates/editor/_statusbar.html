{# Barre d'état : alimentée par StatusBar.js (Monaco) ; « Redémarrer » est géré par Workbench.js. #}
<footer class="status-bar">
    <span class="sb-item sb-issues" id="sb-issues" data-level="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span id="sb-issues-text">Aucun problème</span></span>
    <span class="sb-spacer"></span>
    <span class="sb-item" id="sb-lang">{{ default_lang }}</span>
    <span class="sb-item sb-cursor" id="sb-cursor">Ln 1, Col 1</span>
    <span class="sb-item sb-indent" id="sb-indent">Espaces : 2</span>
    <span class="sb-item" id="sb-lines">Lignes : 1</span>
    <div class="restart">
        <button type="button" class="restart-main" id="restart-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg><span>Redémarrer</span></button>
        <div class="drop">
            <button type="button" class="navlink restart-more" aria-haspopup="true" aria-expanded="false" aria-label="Plus d'actions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            <ul class="drop-menu up" role="menu">
                {% if has_preview %}<li><button type="button" class="drop-item" id="restart-preview">Recharger l'aperçu</button></li>{% endif %}
                <li><button type="button" class="drop-item" id="restart-clear">Effacer la console</button></li>
            </ul>
        </div>
    </div>
</footer>
